<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location - Dee Kitchen</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           LOCATION PAGE
        ========================= */

        body {
            margin: 0;
            background: linear-gradient(
                135deg,
                #c6aec4,
                #f8eef7
            );
            font-family: Arial, sans-serif;
        }

        header {
            background: darkkhaki;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            color: maroon;
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            color: #333;
            margin: 0;
            font-size: 17px;
        }

        .location {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        .location h2 {
            color: #800000;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .location-info {
            background: #f8eef7;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .location-info h3 {
            color: #800000;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .location-info p {
            color: #444;
            font-size: 17px;
            line-height: 1.7;
            margin: 0;
        }

        .description {
            text-align: center;
            color: #444;
            font-size: 16px;
            line-height: 1.7;
            margin: 25px 0;
        }

        /* =========================
           MAP
        ========================= */

        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* =========================
           BUTTONS
        ========================= */

        .location-buttons {
            text-align: center;
            margin-top: 30px;
        }

        .location-buttons a {
            text-decoration: none;
        }

        .location-buttons button {
            background: #800000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 6px;
            transition: 0.3s;
        }

        .location-buttons button:hover {
            background: #5f0000;
            transform: translateY(-2px);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 26px;
            }

            header p {
                font-size: 15px;
            }

            .location {
                margin: 25px 15px;
                padding: 25px 20px;
            }

            .location h2 {
                font-size: 24px;
            }

            .location-info p,
            .description {
                font-size: 15px;
            }

            .map-container {
                height: 300px;
            }

            .location-buttons button {
                width: 100%;
                margin: 6px 0;
            }
        }

    </style>

</head>

<body>

    <header>

        <h1>Our Location</h1>

        <p>Visit Dee Kitchen today!</p>

    </header>


    <section class="location">

        <h2> Find Us</h2>


        <div class="location-info">

            <h3>Dee Kitchen</h3>

            <p>
                Makurdi, Benue State, Nigeria
            </p>

        </div>


        <p class="description">

            We are always ready to serve you with delicious meals,
            desserts, and refreshing drinks.

        </p>


        <div class="map-container">

            <iframe
                src="https://maps.google.com/maps?q=Makurdi,%20Benue%20State,%20Nigeria&t=&z=13&ie=UTF8&iwloc=&output=embed"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>


        <div class="location-buttons">

            <a
                href="https://www.google.com/maps/search/?api=1&query=Makurdi,Benue,Nigeria"
                target="_blank"
                rel="noopener noreferrer"
            >

                <button> Open in Google Maps</button>

            </a>


            <a href="index.html">

                <button> Back to Home</button>

            </a>

        </div>

    </section>

</body>

</html>
